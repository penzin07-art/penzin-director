<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dmitrii Penzin — AI Creative Producer / Director</title>
  <meta name="description" content="AI Creative Producer and Director. Portfolio and contacts." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #0e0602;
      --bg-raised: #1a0c06;
      --border:    #2e1a10;
      --muted:     #7a6050;
      --body:      #d4c8be;
      --heading:   #f5f0eb;
      --accent:    #e8401a;
      --accent-dk: #b83010;

      --font-display: "Bebas Neue", "Arial Narrow", Arial, sans-serif;
      --font-body:    "Inter", system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--body);
      font-size: 1rem;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; border: none; background: none; }
    ul { list-style: none; }
    ::selection { background: var(--accent); color: #fff; }

    .container {
      width: 100%;
      max-width: 1180px;
      margin-inline: auto;
      padding-inline: 2rem;
    }

    /* ── Nav ── */
    .nav {
      padding-block: 1.5rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
    }
    .nav__inner { display: flex; align-items: center; justify-content: space-between; }
    .nav__logo {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--heading);
      border: 1px solid var(--heading);
      padding: 0.375rem 0.875rem;
      letter-spacing: 0.02em;
      transition: border-color 0.15s, color 0.15s;
    }
    .nav__logo:hover { border-color: var(--accent); color: var(--accent); }
    .nav__right { display: flex; align-items: center; gap: 2rem; }
    .nav__line { width: 60px; height: 1px; background: var(--muted); }
    .nav__links { display: flex; gap: 2rem; }
    .nav__links a {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 0.15s;
    }
    .nav__links a:hover { color: var(--heading); }
    .nav__links a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    /* ── Hero ── */
    .hero {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: calc(100svh - 72px);
    }
    .hero__left {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4rem 0;
      gap: 1.5rem;
      position: relative;
    }
    .hero__role {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .hero__title {
      font-family: var(--font-display);
      font-size: clamp(3.5rem, 6vw, 5.5rem);
      color: var(--heading);
      line-height: 0.95;
      letter-spacing: 0.01em;
    }
    .hero__title .accent { color: var(--accent); }
    .hero__dot {
      width: 8px; height: 8px;
      background: var(--accent);
      position: absolute;
      bottom: 4rem;
      right: 2rem;
    }
    .hero__right { position: relative; border-left: 1px solid var(--border); overflow: hidden; }
    .hero__photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%);
      display: block;
    }

    /* ── Works ── */
    .works { padding-block: 5rem; border-top: 1px solid var(--border); }
    .works__header { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 3rem; }
    .section-title {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 4.5vw, 4rem);
      color: var(--heading);
      line-height: 1;
      letter-spacing: 0.02em;
    }
    .works__tabs { display: flex; margin-bottom: 2.5rem; }
    .tab-btn {
      padding: 0.625rem 1.75rem;
      border: 1px solid var(--border);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--muted);
      background: transparent;
      letter-spacing: 0.04em;
      margin-right: -1px;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
    }
    .tab-btn:hover { color: var(--heading); }
    .tab-btn.active {
      background: var(--heading);
      color: var(--bg);
      border-color: var(--heading);
      position: relative;
      z-index: 1;
    }
    .tab-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .works__grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2rem;
    }
    .work-item { background: var(--bg); overflow: hidden; }

    /* Превью с кнопкой play — lazy load iframe */
    .work-item__media { position: relative; }
    .work-item__poster {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 16/9;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    .work-item__poster img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease, opacity 0.3s;
    }
    .work-item__poster:hover img { transform: scale(1.04); opacity: 0.85; }
    .work-item__poster::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(14,6,2,0.85), rgba(14,6,2,0.15) 60%, transparent);
      pointer-events: none;
    }
    .work-item__play {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      width: 68px; height: 68px;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, background 0.2s;
    }
    .work-item__poster:hover .work-item__play {
      transform: translate(-50%, -50%) scale(1.1);
      background: var(--accent-dk);
    }
    .work-item__poster:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .work-item__video-wrap {
      width: 100%;
      aspect-ratio: 16/9;
      position: relative;
      background: #000;
    }
    .work-item__video-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .work-item__body { padding: 1.25rem 0 0; }
    .work-item__title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--heading);
      margin-bottom: 0.25rem;
    }
    .work-item__meta { font-size: 0.8rem; color: var(--muted); letter-spacing: 0.03em; }

    /* ── Contact ── */
    .contact { padding-block: 5rem; border-top: 1px solid var(--border); text-align: center; }
    .contact__title {
      font-family: var(--font-display);
      font-size: clamp(3rem, 7vw, 6.5rem);
      color: var(--heading);
      line-height: 1;
      letter-spacing: 0.02em;
      margin-bottom: 0.5rem;
    }
    .contact__dot { width: 8px; height: 8px; background: var(--accent); margin: 0 auto 2.5rem; }
    .contact__links { display: flex; justify-content: center; gap: 0.75rem; flex-wrap: wrap; }
    .contact-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 140px;
      padding: 0.875rem 2rem;
      background: var(--accent);
      color: #fff;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: background 0.15s;
    }
    .contact-btn:hover { background: var(--accent-dk); }
    .contact-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    /* ── Footer ── */
    .footer { padding-block: 1.5rem; border-top: 1px solid var(--border); }
    .footer__inner { display: flex; align-items: center; justify-content: space-between; }
    .footer__copy { font-size: 0.75rem; color: var(--muted); }

    /* ── Responsive ── */
    @media (max-width: 1000px) {
      .works__grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 860px) {
      .hero { grid-template-columns: 1fr; min-height: auto; }
      .hero__right { display: none; }
      .hero__left { padding-block: 4rem 3rem; }
      .hero__dot { display: none; }
    }
    @media (max-width: 560px) {
      .container { padding-inline: 1.25rem; }
      .nav__line { display: none; }
      .contact__links { flex-direction: column; align-items: center; }
      .contact-btn { width: 100%; max-width: 260px; }
      .footer__inner { flex-direction: column; gap: 0.75rem; text-align: center; }
      .work-item__play { width: 54px; height: 54px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>

        <p class="footer__copy">AI Creative Producer / Director</p>

  <script>
    // Lazy load YouTube iframe при клике на превью
    document.querySelectorAll('.work-item__poster[data-video]').forEach(btn => {
      btn.addEventListener('click', function() {
        const videoId = this.dataset.video;
        const media = this.closest('.work-item__media');
        
        const iframe = document.createElement('div');
        iframe.className = 'work-item__video-wrap';
        iframe.innerHTML = `
          <iframe
            src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
            title="Video player">
          </iframe>
        `;
        
        media.innerHTML = '';
        media.appendChild(iframe);
      });
    });

    // Tabs
    const btns = document.querySelectorAll('.tab-btn');
    const panels = document.querySelectorAll('.tab-panel');

    btns.forEach((btn, i) => {
      btn.addEventListener('click', () => {
        btns.forEach(b => {
          b.classList.remove('active');
          b.setAttribute('aria-selected', 'false');
          b.setAttribute('tabindex', '-1');
        });
        panels.forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        btn.setAttribute('aria-selected', 'true');
        btn.removeAttribute('tabindex');
        panels[i].classList.add('active');
      });

      btn.addEventListener('keydown', e => {
        let idx = i;
        if (e.key === 'ArrowRight') idx = (i + 1) % btns.length;
        else if (e.key === 'ArrowLeft') idx = (i - 1 + btns.length) % btns.length;
        else return;
        btns[idx].click();
        btns[idx].focus();
      });
    });
  </script>
